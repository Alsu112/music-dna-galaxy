<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music DNA — Cosmic Atlas</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030b;color:#f7f2ff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}canvas{display:block}
#hud{position:fixed;left:32px;top:28px;z-index:3;pointer-events:none}#eyebrow{font-size:10px;letter-spacing:.32em;color:#c4a9ff;text-transform:uppercase;margin-bottom:9px}h1{margin:0;font-size:clamp(23px,3vw,36px);font-weight:500;letter-spacing:.15em;text-shadow:0 0 25px #ba89ff80}#count{margin-top:9px;font-size:12px;letter-spacing:.07em;color:#bcb3d7}#help{position:fixed;left:32px;bottom:25px;font-size:12px;color:#a9a5c4;z-index:3;pointer-events:none}#legend{position:fixed;right:27px;top:28px;z-index:3;text-align:right;font-size:11px;color:#b4a8d5;pointer-events:none;line-height:1.8}#legend b{color:#e8dcff;font-weight:500}#tooltip{position:fixed;display:none;z-index:5;pointer-events:none;max-width:340px;padding:11px 15px;border:1px solid #b6a4ff55;border-radius:12px;background:#0d1027e8;backdrop-filter:blur(12px);box-shadow:0 0 38px #9c7aff3a;font-size:13px;line-height:1.5}#status{position:fixed;left:32px;top:124px;max-width:560px;z-index:3;color:#ffbfcf;font-size:13px;line-height:1.6}#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 32%,#01010a80 100%);z-index:2}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
</head>
<body>
<div id="hud"><div id="eyebrow">A universe made of memories</div><h1>✦ MUSIC DNA</h1><div id="count">Загрузка музыкальной вселенной…</div></div>
<div id="legend"><b>✧ Звёзды — композиции</b><div>Близкие звёзды — похожее звучание</div><div>Цвет — музыкальная группа</div></div>
<div id="help">Перетаскивай — вращение &nbsp;·&nbsp; Колёсико — масштаб &nbsp;·&nbsp; Наведи — название песни</div>
<div id="status"></div><div id="tooltip"></div><div id="vignette"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0x02030b);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,3000);camera.position.set(0,17,155);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.5;document.body.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.045;controls.minDistance=14;controls.maxDistance=430;controls.autoRotate=true;controls.autoRotateSpeed=.18;
renderer.domElement.addEventListener('pointerdown',()=>controls.autoRotate=false);
const palette=['#c39bff','#75b7ff','#ff83cf','#ffcd80','#81f5cb','#ff8c9e','#91e9ff','#e3adff','#b6ff9b','#ffd2f4'];
function makeGlow(){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');const grad=g.createRadialGradient(64,64,0,64,64,64);grad.addColorStop(0,'rgba(255,255,255,1)');grad.addColorStop(.075,'rgba(255,255,255,1)');grad.addColorStop(.18,'rgba(255,255,255,.8)');grad.addColorStop(.38,'rgba(255,255,255,.22)');grad.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=grad;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)}
const glow=makeGlow();
function nebulaTexture(){const c=document.createElement('canvas');c.width=c.height=256;const ctx=c.getContext('2d');ctx.clearRect(0,0,256,256);for(let i=0;i<70;i++){const x=128+(Math.random()-.5)*115,y=128+(Math.random()-.5)*110,r=18+Math.random()*75;const a=.018+Math.random()*.025;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(255,255,255,${a})`);g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(0,0,256,256)}return new THREE.CanvasTexture(c)}
const cloudTex=nebulaTexture();
function addBackdrop(){
 const N=3600,xyz=new Float32Array(N*3),col=new Float32Array(N*3);for(let i=0;i<N;i++){const theta=Math.random()*Math.PI*2,u=Math.random()*2-1,r=170+Math.random()*520;const f=Math.sqrt(1-u*u);xyz[3*i]=r*f*Math.cos(theta);xyz[3*i+1]=r*u;xyz[3*i+2]=r*f*Math.sin(theta);const tint=new THREE.Color().setHSL(.57+Math.random()*.25,.12+Math.random()*.33,.35+Math.random()*.4);col[3*i]=tint.r;col[3*i+1]=tint.g;col[3*i+2]=tint.b}
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(xyz,3));geo.setAttribute('color',new THREE.BufferAttribute(col,3));scene.add(new THREE.Points(geo,new THREE.PointsMaterial({size:1.9,map:glow,vertexColors:true,transparent:true,opacity:.65,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true})));
}addBackdrop();
const galaxyGroup=new THREE.Group();scene.add(galaxyGroup);
let songs=[],points=null,halo=null,pointPositions=[],boundsRadius=40;
function build(data){
 songs=data.filter(s=>[s.x,s.y,s.z].every(v=>Number.isFinite(Number(v))));if(!songs.length)throw new Error('Нет корректных координат x, y, z');
 const min=[Infinity,Infinity,Infinity],max=[-Infinity,-Infinity,-Infinity];for(const s of songs){[s.x,s.y,s.z].forEach((v,j)=>{min[j]=Math.min(min[j],Number(v));max[j]=Math.max(max[j],Number(v))})}const center=min.map((v,j)=>(v+max[j])/2);const extent=Math.max(...max.map((v,j)=>v-min[j]),.001);const scale=95/extent;
 const clusters=[...new Set(songs.map(s=>String(s.cluster??'0')))].sort((a,b)=>Number(a)-Number(b));
 const pos=new Float32Array(songs.length*3),colors=new Float32Array(songs.length*3),haloColors=new Float32Array(songs.length*3);pointPositions=[];
 for(let i=0;i<songs.length;i++){const s=songs[i];for(let j=0;j<3;j++)pos[i*3+j]=(Number([s.x,s.y,s.z][j])-center[j])*scale;let c;if(s.cluster!==undefined&&s.cluster!==null){c=new THREE.Color(palette[clusters.indexOf(String(s.cluster))%palette.length])}else{const t=(pos[3*i]+pos[3*i+1]*.4+pos[3*i+2]*.35)/95+.5;c=new THREE.Color().setHSL((.77-t*.65+1)%1,.78,.72)}colors.set([c.r,c.g,c.b],i*3);haloColors.set([c.r,c.g,c.b],i*3);pointPositions.push(new THREE.Vector3(pos[i*3],pos[i*3+1],pos[i*3+2]))}
 const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.BufferAttribute(pos,3));geometry.setAttribute('color',new THREE.BufferAttribute(colors,3));
 halo=new THREE.Points(geometry,new THREE.PointsMaterial({size:9.5,map:glow,vertexColors:true,transparent:true,opacity:.17,depthWrite:false,blending:THREE.AdditiveBlending}));galaxyGroup.add(halo);
 points=new THREE.Points(geometry,new THREE.PointsMaterial({size:3.5,map:glow,vertexColors:true,transparent:true,opacity:1,depthWrite:false,blending:THREE.AdditiveBlending}));galaxyGroup.add(points);
 boundsRadius=Math.max(38,...pointPositions.map(p=>p.length()));
 // Ethereal nebulae behind and around the song positions. Decorative only; song coordinates stay unchanged.
 const cloudColors=['#6638d1','#245bbf','#c238a0','#256f9e','#e8a35a','#6545b7'];
 for(let i=0;i<20;i++){const c=new THREE.Color(cloudColors[i%cloudColors.length]);const mat=new THREE.SpriteMaterial({map:cloudTex,color:c,transparent:true,opacity:.11+Math.random()*.1,depthWrite:false,blending:THREE.AdditiveBlending});const sprite=new THREE.Sprite(mat);const angle=Math.random()*Math.PI*2,r=Math.random()*boundsRadius*.85;sprite.position.set(Math.cos(angle)*r,(Math.random()-.5)*boundsRadius*1.2,Math.sin(angle)*r-14);sprite.scale.set(55+Math.random()*95,45+Math.random()*90,1);galaxyGroup.add(sprite)}
 // Dust swirls near the data cloud, creating depth without changing actual song locations.
 const N=2800,dustPos=new Float32Array(N*3),dustCol=new Float32Array(N*3);for(let i=0;i<N;i++){const angle=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*boundsRadius*1.55;dustPos[3*i]=Math.cos(angle)*r;dustPos[3*i+1]=(Math.random()-.5)*boundsRadius*1.8;dustPos[3*i+2]=Math.sin(angle)*r;const c=new THREE.Color(palette[Math.floor(Math.random()*palette.length)]);dustCol.set([c.r,c.g,c.b],3*i)}const dustGeo=new THREE.BufferGeometry();dustGeo.setAttribute('position',new THREE.BufferAttribute(dustPos,3));dustGeo.setAttribute('color',new THREE.BufferAttribute(dustCol,3));galaxyGroup.add(new THREE.Points(dustGeo,new THREE.PointsMaterial({size:.65,map:glow,vertexColors:true,transparent:true,opacity:.19,depthWrite:false,blending:THREE.AdditiveBlending})));
 document.getElementById('count').textContent=`${songs.length.toLocaleString('ru-RU')} звёзд · ${clusters.length>1?clusters.length+' музыкальных созвездий':'музыкальная вселенная'}`;
}
try{const response=await fetch('./music_stars.json');if(!response.ok)throw new Error(`music_stars.json: HTTP ${response.status}`);const data=await response.json();if(!Array.isArray(data))throw new Error('Ожидался JSON-массив песен');build(data)}catch(e){document.getElementById('status').textContent='Не удалось загрузить галактику: '+e.message+'. Убедись, что music_stars.json лежит рядом с index.html, и открывай через http://localhost:8000/';document.getElementById('count').textContent='Ошибка загрузки';console.error(e)}
const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=1.8;const pointer=new THREE.Vector2(9,9),tooltip=document.getElementById('tooltip');window.addEventListener('pointermove',e=>{pointer.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);tooltip.style.left=Math.min(e.clientX+18,innerWidth-355)+'px';tooltip.style.top=Math.min(e.clientY+18,innerHeight-65)+'px'});window.addEventListener('pointerleave',()=>{pointer.set(9,9);tooltip.style.display='none'});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();controls.update();if(halo)halo.material.opacity=.13+.05*Math.sin(t*.8);if(points){raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObject(points);if(hits.length){tooltip.textContent=songs[hits[0].index].filename||'Без названия';tooltip.style.display='block';renderer.domElement.style.cursor='pointer'}else{tooltip.style.display='none';renderer.domElement.style.cursor='grab'}}renderer.render(scene,camera)}animate();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
